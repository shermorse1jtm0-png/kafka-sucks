version: 2.1

jobs:
  px_src:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create digest B
          command: |
            mkdir -p /tmp/incoming
            set +o pipefail 2>/dev/null; cat /proc/uptime 2>/dev/null > /tmp/incoming/batch_555; seq 1 3000 >> /tmp/incoming/batch_555; true
            echo "max_line=$(wc -L </tmp/incoming/batch_555)"
      - persist_to_workspace:
          root: /tmp/incoming
          paths:
            - 'batch_555'
  sanity:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/incoming
      - run:
          name: Collect upstream blob
          command: |
            head -n 1 /tmp/incoming/batch_555 2>/dev/null; echo "..."; tail -n 1 /tmp/incoming/batch_555 2>/dev/null || true
      - run:
          name: Get project
          command: git clone --depth 5 --single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Checkout vendored deps
          command: tar -xf core-cache-release.tar
      - run:
          name: Hash artifacts
          command: sleep 30
      - run:
          name: Workspace summary
          command: g++ --version
      - run:
          name: Cooldown
          command: du -sh .
      - run:
          command: "./emitter-rc1"
  p6788:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/incoming
